{
  "kind": "Cluster",
  "apiVersion": "eksctl.io/v1alpha5",
  "metadata": {
    "name": "ecommerce-prod",
    "region": "us-east-1",
    "tags": {
      "Project": "E-Commerce Platform",
      "Environment": "Production",
      "Owner": "DevOps Team",
      "Account": "564268554451"
    }
  },
  "iam": {
    "withOIDC": true,
    "serviceAccounts": {
      "withOIDC": true,
      "additional": [
        {
          "name": "ecommerce-app-sa",
          "namespace": "ecommerce-production",
          "wellKnownPolicies": {
            "autoScaler": false,
            "externalDNS": false,
            "certManager": false,
            "loadBalancerController": true
          },
          "attachPolicyARNs": [
            "arn:aws:iam::564268554451:policy/ecommerce-app-policy"
          ]
        },
        {
          "name": "cluster-autoscaler",
          "namespace": "kube-system",
          "wellKnownPolicies": {
            "autoScaler": true
          }
        }
      ]
    }
  },
  "vpc": {
    "cidr": "10.0.0.0/16",
    "nat": {
      "gateway": "HighlyAvailable"
    },
    "subnets": {
      "private": {
        "us-east-1a": {
          "cidr": "10.0.1.0/19",
          "az": "us-east-1a"
        },
        "us-east-1b": {
          "cidr": "10.0.2.0/19",
          "az": "us-east-1b"
        },
        "us-east-1c": {
          "cidr": "10.0.3.0/19",
          "az": "us-east-1c"
        }
      },
      "public": {
        "us-east-1a": {
          "cidr": "10.0.4.0/19",
          "az": "us-east-1a"
        },
        "us-east-1b": {
          "cidr": "10.0.5.0/19",
          "az": "us-east-1b"
        },
        "us-east-1c": {
          "cidr": "10.0.6.0/19",
          "az": "us-east-1c"
        }
      }
    },
    "manageSharedNodeSecurityGroupRules": true
  },
  "nodeGroups": [
    {
      "name": "standard-workers",
      "instanceType": "m5.xlarge",
      "minSize": 3,
      "maxSize": 10,
      "desiredCapacity": 3,
      "volumeSize": 50,
      "volumeType": "gp3",
      "volumeIOPS": 3000,
      "volumeThroughput": 125,
      "privateNetworking": true,
      "ssh": {
        "allow": true,
        "publicKeyPath": "~/.ssh/id_rsa.pub"
      },
      "tags": {
        "NodeGroup": "Standard",
        "Environment": "Production"
      },
      "labels": {
        "workload-type": "standard"
      },
      "iam": {
        "withAddonPolicies": {
          "autoScaler": true,
          "externalDNS": true,
          "certManager": true,
          "loadBalancerController": true,
          "cloudWatch": true,
          "ebs": true
        }
      },
      "scalingConfig": {
        "minSize": 3,
        "maxSize": 10,
        "desiredCapacity": 3
      }
    },
    {
      "name": "database-workers",
      "instanceType": "m5.2xlarge",
      "minSize": 3,
      "maxSize": 6,
      "desiredCapacity": 3,
      "volumeSize": 100,
      "volumeType": "gp3",
      "volumeIOPS": 5000,
      "volumeThroughput": 250,
      "privateNetworking": true,
      "taints": {
        "database": {
          "value": "true",
          "effect": "NoSchedule"
        }
      },
      "labels": {
        "workload-type": "database"
      },
      "iam": {
        "withAddonPolicies": {
          "autoScaler": true,
          "ebs": true
        }
      }
    }
  ],
  "addons": [
    {
      "name": "aws-ebs-csi-driver",
      "version": "latest",
      "attachPolicyARNs": [
        "arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
      ]
    },
    {
      "name": "aws-efs-csi-driver",
      "version": "latest"
    },
    {
      "name": "coredns",
      "version": "latest"
    },
    {
      "name": "kube-proxy",
      "version": "latest"
    },
    {
      "name": "vpc-cni",
      "version": "latest"
    },
    {
      "name": "metrics-server",
      "version": "latest"
    }
  ],
  "cloudWatch": {
    "clusterLogging": {
      "enableTypes": [
        "api",
        "audit",
        "authenticator",
        "controllerManager",
        "scheduler"
      ]
    }
  },
  "secretsEncryption": {
    "keyARN": "arn:aws:kms:us-east-1:564268554451:key/ecommerce-eks-secrets"
  },
  "accessConfig": {
    "authenticationMode": "API_AND_CONFIG_MAP"
  }
}
