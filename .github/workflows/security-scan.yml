name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure dependencies
      run: |
        sudo dnf update -y
        sudo dnf install -y curl tar gzip git

    - name: Install Trivy
      run: |
        curl -sfL https://github.com/aquasecurity/trivy/releases/latest/download/trivy_$(uname -s)_$(uname -m).tar.gz -o trivy.tar.gz
        tar -xzf trivy.tar.gz
        sudo mv trivy /usr/local/bin/
        trivy --version

    - name: Scan Kubernetes manifests
      run: |
        mkdir -p manifests
        trivy config manifests/ || true

    - name: Install kube-bench
      run: |
        curl -sfL https://github.com/aquasecurity/kube-bench/releases/download/v0.6.12/kube-bench_0.6.12_linux_amd64.tar.gz -o kube-bench.tar.gz
        tar -xzf kube-bench.tar.gz
        sudo mv kube-bench /usr/local/bin/
        kube-bench || true

    - name: Hardcoded secrets check
      run: |
        grep -r "password:" manifests/ || echo "No obvious passwords found"
        grep -r "secret:" manifests/ || echo "No obvious secrets found"

    - name: Pod security validation
      run: |
        if grep -r "privileged: true" manifests/; then echo "Privileged containers found"; else echo "No privileged containers"; fi
        if grep -r "runAsUser: 0" manifests/; then echo "Containers running as root"; else echo "No root containers"; fi

    - name: Generate GitHub summary
      run: |
        echo "## Security Scan Report" >> $GITHUB_STEP_SUMMARY
        echo "### Date: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "### Manifest files scanned: $(ls manifests/*.yaml 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- Trivy scan: completed" >> $GITHUB_STEP_SUMMARY
        echo "- kube-bench scan: completed" >> $GITHUB_STEP_SUMMARY
        echo "- Hardcoded secrets check: completed" >> $GITHUB_STEP_SUMMARY

